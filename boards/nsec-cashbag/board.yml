name: "Cash Bag"
slug: nsec-cashbag
status: porting            # designed and rule-checked; no physical SAO++ board built yet
revision: "A"

original:
  title: "Sao_CashBag (NorthSec 2025 badge add-on)"
  makers: ["NorthSec 2025 badge team (nsec/nsec-badge)"]
  year: 2025
  source_url: "https://github.com/nsec/nsec-badge/tree/0ea779f281ac538fa21b333b027250784b5d3cbf/hw/2025/sao/Sao_CashBag"
  license: "MIT"           # repo root LICENSE: MIT "except otherwise stated in respective files"; no file of this board or of hw/2025/sao/libs states an exception (checked at commit 0ea779f, 2025-07-14)
  permission: "license"
  permission_ref: "original/LICENSE"
  art_note: "FRONT ART AND OUTLINE ARE SAO++'S OWN DRAWING (CC-BY-SA-4.0), generated from a few numbers in hardware/build_board.py and saved as art/cash-bag.svg. NorthSec's original outline and front picture were traced from a stock illustration (a watermarked stock-library preview sat in the maker's folder and was embedded in the board file); that picture and everything traced from it are NOT reproduced anywhere in this repo: they were cut from original/ (see original/README.md). Still open: the 'nsec 2025' logo on the back is NorthSec's event branding. It is kept as the maker's credit; the MIT licence covers the file, not the right to trade under their name, so ask NorthSec before selling boards that carry it."

changes:
  - "NEW DRAWING. The board is SAO++'s own money scene, 65.7 x 37.8 mm: a banded wad of bank notes with a second note tucked behind it (left), a tied sack with a gold '$' (middle), one big gold-rimmed coin with a '$' (right). None of the maker's outline or front art is used. The maker's board was 38.4 x 25.2 mm, too small for the cell clip, connector and switch together"
  - "The maker's three 1206 LEDs on the FRONT become three reverse-mount white LEDs on the back (SAOPP-LED-11), shining through the board: at the sack's gathered top, in the bank note's round medallion, and as a glint at the top of the coin"
  - "Three 330 ohm 1206 resistors become three shared 1.3 k 0603 resistors (SAOPP-R-01)"
  - "The maker's SMD 2x3 header becomes the 6-pin SAO v1.69bis shrouded, keyed SMD connector, behind the coin, with 3.6 mm of board all round its body"
  - "Added: CR2032 clip behind the sack (cell slides in from the bottom edge) and the SAO / OFF / BAT slide switch on the left edge behind the notes. The original had no battery and no switch"
  - "All wiring on the back, no vias (the maker had 6). Two 0.9 mm switch-peg holes come through the wad of notes on the front"
  - "Back: the maker's 'nsec 2025' logo and white write-on square are kept at their real size, the logo behind the wad of notes, the square behind the tucked note. New labels: SAO / OFF / BAT, CR2032 + UP, pin 1, CASH BAG, SAO++ rA"
  - "All copper kept 0.55 mm back from the edge"

features:
  power_select: true
  coin_cell: CR2032
  side_leds: 0
  through_board_leds: 3
  i2c_device: false
  gpio_use: ""

shared_parts:
  - SAOPP-CONN-01
  - SAOPP-SW-01
  - SAOPP-BAT-01
  - SAOPP-LED-11
  - SAOPP-R-01

local_parts: []
