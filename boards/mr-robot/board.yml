name: "Mr. Robot"
slug: mr-robot
status: porting            # designed and rule-checked; no physical SAO++ board built yet
revision: "A"

original:
  title: "Mr. Robot Simple Add-on (\"Mr. Robot Shitty Add-on\")"
  makers: ["davedarko (Dave Darko)"]
  year: 2019
  source_url: "https://github.com/davedarko/Simple-Add-ons-SAO/tree/main/Mr%20Robot%20Badge"
  project_url: "https://hackaday.io/project/168037-mr-robot-shitty-addon"
  license: "none stated"   # the repository (commit 1a08593) gives no license anywhere, so all rights are reserved by default
  permission: "pending"    # not asked yet; change to "written" and fill permission_ref when the maker answers
  permission_ref: ""
  pending_decision: "Repo owner (holdTheDoorHoid) chose on 2026-11-12 to publish before permission was received, accepting that it may have to come down."
  base_revision: "the only revision in the repo (Eagle saomr.brd/.sch, with the maker's KiCad 8 import in original/KiCad8); his readme says its amplifier does not work"
  art_note: "The face is the mask from the TV series Mr. Robot (Universal Content Productions / USA Network). It is a third-party likeness: not ours, and not the maker's to license. That is separate from davedarko's permission and would need its own clearance before any sale."
  inspired_by: "Brian Benchoff's large Mr. Robot badge (named in the maker's write-up)"

scale:
  factor: 1.10             # owner rule 2026-11-12: whole board (outline and art) scaled up uniformly to fit the parts
  original_size_mm: "40.0 x 39.8"
  new_size_mm: "44.0 x 42.7"   # after scaling, the top of the head is cut flat by 0.64 mm and the chin by 0.48 mm

changes:
  - "Whole board scaled up 1.10x (40.0 x 39.8 mm -> 44.0 x 43.8 mm before the two flats below), outline and art together"
  - "Board turned over: the maker's face (his bottom copper, bottom silkscreen and the 'dave' / 'darko' mask lettering in the eyes) is now the front; his parts side, with his gold 'ds' logo, is the back"
  - "ATtiny85 replaced by a Seeed Studio XIAO ESP32 (C3, S3 or C6) on the back, USB-C at the top of the head"
  - "The maker's amplifier (BC847 class-A stage with 22 uF and 2k2, which his readme says does not work) replaced by a plain switch: BC847 low-side, 1.3 k base resistor, two 330 ohm in parallel feeding the sounder, flyback diode and 1.3 k bleed resistor across it"
  - "Sounder: the maker's KMTG-1102 on his own footprint, in the left cheek (front view)"
  - "Dropped: ATtiny85, its 4k7 reset pull-up, 100 nF, 22 uF, 2k2, the ISP pads, the two test pads, the jumper R3"
  - "His 6-pin SMD header (SAO v1 4-pin wiring) replaced by the shared shrouded SAO v1.69bis connector, key up, 2.7 mm left of centre"
  - "SAO / OFF / USB-BAT slide switch, knob out of the chin; JST-PH LiPo socket in the right cheek, opening to the right edge"
  - "Top of the head cut flat by 0.64 mm over 9 mm (so a USB-C plug body clears the board) and the chin by 0.48 mm over 11 mm (so the switch knob sticks out)"
  - "Maker's gold logo kept on the back unchanged in shape (scaled with the board) and in place; 'dave' / 'darko' kept in the eyes"

features:
  power_select: true
  coin_cell: none
  lipo_connector: JST-PH
  sounder: "KMTG-1102 (maker's), driven from XIAO D10"
  side_leds: 0
  through_board_leds: 0
  vias: 0
  i2c_device: true         # wired to XIAO D4/D5; the firmware decides the address (the maker's sketches used 0x08)
  gpio_use: "GPIO1 -> XIAO D7 (RX), GPIO2 -> XIAO D6 (TX), each through 330 ohm"
  controller: "Seeed Studio XIAO ESP32-C3 / S3 / C6"

shared_parts:
  - SAOPP-CONN-01
  - SAOPP-SW-01
  - SAOPP-MCU-01
  - SAOPP-CONN-10
  - SAOPP-R-01
  - SAOPP-R-02
  - SAOPP-D-01

local_parts:
  - {name: Sounder_KMTG1102, ref: LS1, mpn: "KMTG1102-A1 (maker's BOM says only 'KMTG-1102'; suffix to confirm)", footprint: "maker's KMTG-1102 (original/KiCad8), pads renamed 1/2, courtyard added"}
  - {name: Q_NPN_BC847, ref: Q1, mpn: "BC847B,215", footprint: "KiCad stock Package_TO_SOT_SMD:SOT-23"}
  - {name: D_Schottky_RB751, ref: D1, mpn: RB751S40T1G, implements: SAOPP-D-01, footprint: "KiCad stock Diode_SMD:D_SOD-523 (as boards/knight-rider)"}
