name: "COVID-19 Test"
slug: covid-test
status: porting            # designed and rule-checked; no physical SAO++ board built yet
revision: "B"
scale:
  factor: 1.48             # whole board and art, uniform, about the board centre (owner decision 2026-11-12)
  old_size_mm: [16.0, 50.0]
  new_size_mm: [23.68, 74.0]
  why: "The cell (20 mm) and the shared clip (21 mm cell plus closed end) need about 21.5 mm of width; that alone needs 1.344. At 1.344-1.47 the cell would cover the start of the maker's back URL ('https:'); 1.48 is the smallest factor at which the cell, clip, switch and connector all fit on the board with every maker credit uncovered. Tried: 1.344 (cell fits, URL start hidden, switch does not fit between logo and clip), 1.375 and 1.45 (URL start hidden), 1.48 (clean)."
  compromises_gone:
    - "CR2032 overhung both long edges by 2.0 mm and the clip's closed end stuck out 3.1 mm; now wholly on the board (cell 2.3 mm inside the left edge, clip body 0.39 mm inside the right edge)"
    - "board-local narrowed clip footprint (17 mm contact cut to a 14.9 mm band); dropped, the shared SAOPP-BAT-01 footprint is used unchanged"
    - "maker's back credits (hackaday URL, '@davedarko@chaos.social', '2022/11', dd logo) had moved to the front; back where he put them, scaled with the art, none covered by a part or the cell"
    - "two tented GND vias and front copper used as GND; gone: everything routes on the back copper, the front pour is unconnected art as the maker had it"
    - "connector body 0.37 mm from both long edges; now 4.2 mm, house rule (3 mm) met, still where the maker's header was (scaled)"
    - "panel: 44 'hole inside courtyard' errors and a 3.5 mm slot for the overhanging clip; now 0 errors and the usual 2 mm slot"
    - "extra .kicad_dru rule for fine art gaps; removed (not needed at the new size)"
  compromises_remaining:
    - "the cell covers the back of the sample well (as in rev A)"
    - "the maker's back assembly note stays removed (it names his old parts and would sit under the cell)"
    - "the switch moved from the top edge to the right edge (knob out to the right): the top of the back is the maker's credit block"

original:
  title: "COVID-19 Test SAO (Simple Add-On)"
  makers: ["davedarko (Dave Darko)"]
  year: 2022
  source_url: "https://github.com/davedarko/Simple-Add-ons-SAO/tree/main/COVID-19%20Test%20SAO"
  project_page: "https://hackaday.io/project/187615-covid-19-sao-simple-add-on"
  source_commit: "1a08593"
  license: "none stated"   # neither the repo nor the project page gives a license, so all rights are reserved by default
  permission: "pending"    # no reply yet; change to "written" and fill permission_ref when davedarko answers
  permission_ref: ""
  pending_decision: "Repo owner (holdTheDoorHoid) chose on 2026-11-11 to publish before permission was received, accepting that it may have to come down."
  art_note: "A rapid antigen test cassette drawn by davedarko. No third-party character."

changes:
  - "Rev B: whole board and art scaled up 1.48x (outline, front art, mask windows, back credits and logo, uniformly): 16 x 50 mm becomes 23.68 x 74.0 mm. Parts keep their real size"
  - "Through-hole 2x3 IDC header replaced by the 6-pin v1.69bis SMD shrouded header, where the maker's header was (scaled)"
  - "New: SAO / OFF / BATTERY slide switch on the right edge (knob out to the right, front view) and a CR2032 clip over the lower part of the back. The original ran from the badge only"
  - "Timer: LMC555 (CMOS, runs from 1.5 V), as the maker's readme asks; his schematic's NE555 needs 4.5 V and does not run from 3.3 V or a coin cell"
  - "Timing set to 3.3M + 3.3M + 100 nF (D2 on 0.46 s, off 0.23 s). The maker's own three sources disagree; his built board blinked 0.33 s on, 0.33 s off"
  - "Two red LEDs soldered upside down replaced by red reverse-mount 1206 LEDs in the same spots (scaled), 1.3 k resistor each"
  - "Added C2, a 100 nF supply capacitor beside the timer (same part as C1)"
  - "Back copper is a GND pour; everything routes on the back, no vias. Front copper is the maker's pour, unchanged in shape (scaled) and unconnected, as he had it"
  - "The maker's back credits stay on the back where he put them (scaled with the art): '2022/11' and '@davedarko@chaos.social' at the top, the hackaday URL along the left edge, the dd logo right of the window"
  - "Removed: the maker's back assembly note ('C1+R2 main blink parts ...'), which named the old parts and would sit under the cell, and the two back mask windows behind the old LEDs (the new LED brings its own)"
  - "Front art otherwise unchanged (scaled): window, C and T lines, sample well, shading, 'COVID-19Ag'. New on the front: two 0.9 mm switch peg holes near the right edge"

features:
  power_select: true
  coin_cell: CR2032
  side_leds: 0
  through_board_leds: 2
  i2c_device: false
  gpio_use: ""

shared_parts:
  - SAOPP-CONN-01
  - SAOPP-SW-01
  - SAOPP-BAT-01
  - SAOPP-LED-10
  - SAOPP-R-01
  - SAOPP-C-01

local_parts:
  - id: "Timer_LMC555_SOIC8"
    mpn: "LMC555CMX/NOPB"
    footprint: "KiCad stock Package_SO:SOIC-8_3.9x4.9mm_P1.27mm (copied unchanged)"
    use: "U1, the blink timer"
  - id: "R_Timing_3M3"
    mpn: "0603WAF3304T5E"
    footprint: "KiCad stock Resistor_SMD:R_0603_1608Metric (copied unchanged)"
    use: "R1 and R2, the two timing resistors"
