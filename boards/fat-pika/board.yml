name: "Fat Pika"
slug: fat-pika
status: porting            # designed and rule-checked; no physical SAO++ board built yet
revision: "A"

original:
  title: "Fat Pika (TwinkleTwinkie's DC26 Shitty Add-on #2), board v1.3"
  makers: ["TwinkleTwinkie"]
  year: 2018
  source_url: "https://hackaday.io/project/158665-fat-pika"
  license: "none stated"   # the project page gives no license, so all rights are reserved by default
  permission: "pending"    # no reply yet; change to "written" and fill permission_ref when TwinkleTwinkie answers
  permission_ref: ""       # docs/permission.md once there is a reply
  pending_decision: "Repo owner (holdTheDoorHoid) chose on 2026-11-10 to publish before permission was received, accepting that it may have to come down."
  art_note: "Pikachu, Pichu, Raichu and Lord Helix are Pokemon characters (Nintendo / The Pokemon Company). Separate from the maker's permission. Owner decision 2026-11-10: keep the art, decide before selling."

changes:
  - "4-pin through-hole SAO v1 header replaced by the 6-pin v1.69bis SMD shrouded header, moved from the foot to the lower belly"
  - "SAO / OFF / BATTERY slide switch on the bottom edge; CR2032 clip on the back"
  - "Obsolete OSRAM TOPLED cheeks replaced by reverse-mount 1206 red LEDs in the same spots, one resistor each instead of one shared"
  - "Back copper art still doubles as ground; old track channels and the old header window filled in"
  - "Copper pulled 0.28 mm back from the board edge; outline redrawn as two clean closed paths (same shape)"
  - "Back art lost under new parts: Raichu (mostly under the cell), the belly 'DEF CON 26' lettering, Pichu's feet (under the connector)"

features:
  power_select: true
  coin_cell: CR2032
  side_leds: 0
  through_board_leds: 2
  i2c_device: false
  gpio_use: ""

shared_parts:
  - SAOPP-CONN-01
  - SAOPP-SW-01
  - SAOPP-BAT-01
  - SAOPP-LED-10
  - SAOPP-R-01
