name: "Lecco Postcard"
slug: lecco
status: porting            # designed and rule-checked; no physical SAO++ board built yet
revision: "A"

original:
  title: "LECCO postcard SAO (Hackaday Europe 2026, Lecco, Italy)"
  makers: ["davedarko (Dave Darko)"]
  year: 2026
  source_url: "https://github.com/davedarko/Simple-Add-ons-SAO/tree/main/Lecco"
  license: "none stated"   # no license anywhere in the maker's repo (commit 1a08593), so all rights are reserved by default
  permission: "pending"    # not yet asked; change to "written" and fill permission_ref when davedarko answers
  permission_ref: ""
  pending_decision: "Repo owner (holdTheDoorHoid) chose on 2026-11-12 to publish before permission was received, accepting that it may have to come down."
  art_note: "The front shows a real place, the Azzone Visconti bridge in Lecco with the mountains behind it, and the back message names the Hackaday Europe 2026 event. Hackaday names and marks belong to their owners; nothing of theirs is added. Everything of the maker's is kept exactly as drawn."

scale:
  factor: 1.2
  original_size_mm: [54.0, 40.0]
  new_size_mm: [64.8, 48.0]
  why: "The 15.3 mm SAO connector body does not fit in the 13.4 mm strip beside the handwritten message at original size (owner rule 2026-11-12: scale up rather than cover art or overhang). 1.18 is the bare minimum; 1.2 leaves 0.3-0.5 mm each side."

changes:
  - "Whole board scaled up 1.2x (outline, front engraving, lettering, logo, back message, uniformly): 54 x 40 mm becomes 64.8 x 48 mm"
  - "The LED the maker meant to be bodged across two round VCC / GND pads is now a real part: one shared white reverse-mount LED on the back, centred behind the bare-board word ITALY, which the maker left free of copper and solder mask on both sides so it could glow"
  - "The maker's resistor ('bridge or add resistor', no value given) becomes the shared 1.3 k resistor"
  - "The maker's 2x3 SMD socket footprint (a pin-socket pattern, mirrored compared with the pin header he asks for) becomes the shared 6-pin SAO v1.69bis shrouded connector, key slot up, pin 1 in the Mad Cat corner, in the strip right of the message (front view)"
  - "No coin cell and no switch: the cell needs a 21 mm wide clear space and the only clear strip on the back is 13.4 mm (16.1 mm after scaling); see README 'Why no battery'. Badge power only, as on the maker's original"
  - "Texts drawn in the Futura and Bradley Hand fonts (LECCO, ITALY, the handwritten message and signature) are re-drawn from the outlines saved in the maker's file, so they come out as he drew them on machines without those fonts"
  - "Removed: the maker's 'VCC' / 'GND' / 'bridge or add resistor' labels (they described the removed pads). Kept unchanged: the message, signature, date, logo and 'fancy a LED?'"
  - "The back ITALY mask window is trimmed 0.1 mm clear of the two short LED tracks (about 1.1 mm2 of 12.2 mm2, mostly under the LED itself)"

features:
  power_select: false
  coin_cell: ""
  side_leds: 0
  through_board_leds: 1
  i2c_device: false
  gpio_use: ""

shared_parts:
  - SAOPP-CONN-01
  - SAOPP-LED-11
  - SAOPP-R-01

local_parts: []            # none
