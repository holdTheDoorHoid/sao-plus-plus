[package]
name = "eggplant-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Board-independent logic for the Eggplant SAO (SAO++ edition): the maker's LED fades, his I2C commands and his infection game"
publish = false
license = "MIT"

# Plain no_std library. Everything here is checked on the host with `cargo test`;
# the firmware crate in ../eggplant-fw links it for the ESP32 targets.

[features]
# Answer at the maker's original I2C address 0x36 instead of the house address
# 0x28, so badge code written for his 2018 board finds this one.
# Build the firmware with `cargo c3 --features maker-address` (see README).
maker-address = []

[dependencies]

[lints.rust]
unsafe_code = "forbid"
