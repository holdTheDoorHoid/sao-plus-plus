name: "Eggplant"
slug: eggplant
status: porting            # designed and rule-checked; no physical SAO++ board built yet
revision: "A"

original:
  title: "DC Darknet \"Official\" Eggplant Emoji Shitty Add-on (DC26)"
  makers: ["thedarknet (Darknet Industries)", "Krux (designer, named in the sketch)"]
  year: 2018
  source_url: "https://github.com/thedarknet/dc26-badge/tree/63ec6ed/hardware/dc26-sao/eggplant"
  firmware_url: "https://github.com/thedarknet/dc26-badge/tree/63ec6ed/dc26-sao"
  commit: "63ec6ed"
  license: "MIT"           # original/LICENSE: "MIT License, Copyright (c) 2017" (no name in the notice)
  permission: "license"    # open licence: no permission needed; keep the MIT notice (in original/ and in the README)
  permission_note: "not needed (open licence)"
  permission_ref: "original/LICENSE"
  base_revision: "the only revision in the repo (Eagle eggplant.brd / eggplant.sch, with BOM; ATtiny85 sketch in dc26-sao/eggplant)"
  art_note: "The shape is the eggplant emoji, the way the maker drew it; no third-party character, logo or trade dress."

scale:
  factor: 1.35             # owner rule 2026-11-12: whole board (outline and art) scaled up uniformly to fit the parts
  original_size_mm: "27.6 x 55.9"
  new_size_mm: "37.3 x 75.4"   # one flat, at most 0.71 mm deep over 13 mm, where the switch knob comes out

changes:
  - "Whole board scaled up 1.35x (27.6 x 55.9 mm -> 37.3 x 75.4 mm), outline and art together; the right-hand side of the bulb is cut flat by at most 0.71 mm over 13 mm for the switch knob"
  - "ATtiny85 replaced by a Seeed Studio XIAO ESP32 (C3, S3 or C6) across the bottom of the eggplant, USB-C out of the left-hand side"
  - "New Rust firmware re-implementing the maker's light shows, I2C commands and infection game (firmware/)"
  - "His 4-pin SMD header replaced by the shared shrouded SAO v1.69bis connector, in the upper body, turned 45 degrees as his was"
  - "SAO / OFF / USB-BAT slide switch, knob out of the right-hand side of the bulb; JST-PH LiPo socket below it, opening to the lower right"
  - "His five bicolour blue/red LEDs kept (his part, his land pattern, on the back facing out as on his board). LED2 is where he put it; LED1, LED3, LED4 and LED5 moved 6-13 mm because the connector, switch, XIAO and his credit now sit on their spots. One resistor per colour per LED as on his board, values changed from 22 ohm to 330 ohm (blue) and 1.3 k (red)"
  - "Dropped: ATtiny85, his 10 k reset pull-up, his two 10 k I2C pull-ups (the badge has them), two 0 ohm links, the six ISP pogo pads"
  - "Front: his stem and calyx stay bare gold, his body copper is now the ground plane (it was his ground pour), his light stripe stays copper-free. 33 tented vias: 15 ground vias joining back ground islands to that plane, and 18 forming 9 short links under the front mask where a back track could not get past another"
  - "Back: his stem and calyx copper art, leaf and highlight kept; his light stripe on the back is now ground copper (the parts there need it)"
  - "His lettering: the credit block moved 1.6 mm and 'krux was here' 12.4 mm, both unchanged; the base64 line and its 16 strokes stay where he put them, now under the SAO connector's shroud (owner decision)"

features:
  power_select: true
  coin_cell: none
  lipo_connector: JST-PH
  side_leds: 0
  through_board_leds: 0
  bicolour_leds: 5         # maker's part, back side, facing away from the board as on his
  vias: 33                # all tented: 15 ground stitching, 18 in 9 front links
  i2c_device: true         # house address 0x28; the maker's 0x36 with the firmware's maker-address option
  gpio_use: "GPIO1 -> XIAO D7 (RX), GPIO2 -> XIAO D6 (TX), each through 330 ohm"
  controller: "Seeed Studio XIAO ESP32-C3 / S3 / C6"

shared_parts:
  - SAOPP-CONN-01
  - SAOPP-SW-01
  - SAOPP-MCU-01
  - SAOPP-CONN-10
  - SAOPP-R-01
  - SAOPP-R-02

local_parts:
  - {name: LED_Bicolour_0805, ref: "D1-D5", mpn: "PHBM2012QBDSURKC (as the maker's BOM writes it; Kingbright's catalogue form is to be confirmed)", lcsc: "", footprint: "maker's own 0805-DUALLED package, read from original/eggplant/eggplant.brd by make_local_footprints.py"}
